[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented preprint identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
arxiv-validation-claim-audit = "arxiv_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["arxiv_validation_claim_audit*"]
